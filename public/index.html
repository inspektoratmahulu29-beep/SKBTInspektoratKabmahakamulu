<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKBT - Inspektorat Mahakam Ulu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --primary: #0077b6;
      --primary-light: #00b4d8;
      --secondary: #90e0ef;
      --dark: #03045e;
      --green: #06d6a0;
      --green-dark: #118ab2;
      --white: #ffffff;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.15);
      --text: #f8f9fa;
      --text-muted: #adb5bd;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #03045e, #0077b6, #00b4d8, #06d6a0);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: var(--text);
      min-height: 100vh;
      padding: 30px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ====== HEADER ====== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      padding: 15px 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo-wrapper img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .header-title {
      text-align: center;
      flex: 1;
    }

    .header-title h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, #90e0ef, #06d6a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 5px 0 0;
    }

    /* ====== HERO ====== */
    .hero {
      background: rgba(3, 4, 94, 0.55);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(0, 180, 216, 0.2), transparent, rgba(6, 214, 160, 0.2), transparent);
      animation: rotateBorder 15s linear infinite;
      z-index: -1;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ====== STEP INDICATOR ====== */
    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 40px;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 50px;
      border: 1px solid var(--border);
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-muted);
      opacity: 0.5;
      transition: all 0.3s ease;
    }

    .step.active {
      opacity: 1;
      color: #fff;
    }

    .step-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .step.active .step-icon {
      background: linear-gradient(135deg, #00b4d8, #06d6a0);
      border: none;
      box-shadow: 0 4px 15px rgba(0, 180, 216, 0.5);
    }

    /* ====== FORM SECTION ====== */
    .form-section {
      margin-bottom: 30px;
    }

    .form-section-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 8px;
      display: block;
    }

    .form-control, .form-select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      transition: all 0.3s;
    }

    .form-control:focus, .form-select:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--primary-light);
      outline: none;
      box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.2);
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    /* ====== CEKLIS DOKUMEN ====== */
    .doc-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
      transition: all 0.3s;
    }

    .doc-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(6, 214, 160, 0.3);
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .form-check-input {
      width: 22px;
      height: 22px;
      background-color: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      cursor: pointer;
    }

    .form-check-input:checked {
      background-color: var(--green);
      border-color: var(--green);
    }

    .form-check-label {
      font-weight: 500;
    }

    /* ====== UPLOAD AREA ====== */
    .upload-area {
      border: 2px dashed rgba(0, 180, 216, 0.5);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(0, 180, 216, 0.05);
      margin-top: 10px;
    }

    .upload-area:hover {
      border-color: var(--green);
      background: rgba(6, 214, 160, 0.1);
      transform: translateY(-2px);
    }

    .upload-area svg {
      width: 32px;
      height: 32px;
      fill: var(--secondary);
      margin-bottom: 8px;
    }

    .upload-status {
      font-size: 0.85rem;
      margin-top: 10px;
      display: block;
      color: var(--text-muted);
    }

    .upload-status.success {
      color: var(--green);
    }

    .upload-status.error {
      color: #ff6b6b;
    }

    .progress-upload {
      height: 8px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00b4d8, #06d6a0);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ====== RIWAYAT UPLOAD ====== */
    .file-history {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .file-item a {
      color: #90e0ef;
      text-decoration: none;
    }

    .file-item a:hover {
      color: #06d6a0;
    }

    /* ====== BUTTON ====== */
    .btn-gradient {
      background: linear-gradient(135deg, #00b4d8, #06d6a0);
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 50px;
      box-shadow: 0 8px 25px rgba(6, 214, 160, 0.4);
      transition: all 0.3s;
    }

    .btn-gradient:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 35px rgba(6, 214, 160, 0.6);
    }

    .btn-outline-light-custom {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      transition: all 0.3s;
    }

    .btn-outline-light-custom:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary-light);
    }

    /* ====== LIST ====== */
    .list-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }

    .list-item:hover {
      background: var(--surface-hover);
      transform: translateX(5px);
      border-color: rgba(0, 180, 216, 0.4);
    }

    .badge-custom {
      background: rgba(6, 214, 160, 0.2);
      color: #06d6a0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(6, 214, 160, 0.3);
    }

    /* ====== ANIMASI ====== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-up {
      animation: fadeUp 0.6s ease;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER LOGO -->
  <div class="header">
    <div class="logo-wrapper">
      <img src="/logo-mahakam.png" alt="Logo Kabupaten Mahakam Ulu" title="Pemerintah Kabupaten Mahakam Ulu">
    </div>
    <div class="header-title">
      <h1>Pengajuan SKBT</h1>
      <p>Surat Keterangan Bebas Temuan - Inspektorat Daerah Kabupaten Mahakam Ulu</p>
    </div>
    <div class="logo-wrapper">
      <img src="/logo-inspektorat.png" alt="Logo Inspektorat" title="Inspektorat Daerah Kabupaten Mahakam Ulu">
    </div>
  </div>

  <div class="hero">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="form-section-title">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="color:#00b4d8;">
            <path d="M4 6H20V8H4V6ZM4 11H20V13H4V11ZM4 16H14V18H4V16Z"/>
          </svg>
          Daftar Pengajuan
        </h4>
      </div>
      <button class="btn-outline-light-custom" onclick="tampilkanPengajuan()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-right:6px;">
          <path d="M4 6H20V8H4V6ZM4 11H20V13H4V11ZM4 16H14V18H4V16Z"/>
        </svg>
        Lihat Pengajuan
      </button>
    </div>

    <!-- STEP INDICATOR -->
    <div class="step-indicator">
      <div class="step active" id="step1"><span class="step-icon">1</span> Data Pemohon</div>
      <div class="step" id="step2"><span class="step-icon">2</span> Upload Dokumen</div>
      <div class="step" id="step3"><span class="step-icon">3</span> Selesai</div>
    </div>

    <!-- ===== HALAMAN 1: DATA PEMOHON ===== -->
    <div id="halaman1" class="fade-up">
      <div class="form-section">
        <h4 class="form-section-title">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="color:#00b4d8;">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          Data Pemohon
        </h4>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" id="nama" class="form-control" placeholder="Nama Pemohon">
          </div>
          <div class="col-md-6">
            <label class="form-label">NIP</label>
            <input type="text" id="nip" class="form-control" placeholder="NIP">
          </div>
          <div class="col-md-6">
            <label class="form-label">Jabatan</label>
            <input type="text" id="jabatan" class="form-control" placeholder="Jabatan">
          </div>
          <div class="col-md-6">
            <label class="form-label">Unit Kerja / OPD</label>
            <input type="text" id="unit" class="form-control" placeholder="Unit Kerja">
          </div>
          <div class="col-md-6">
            <label class="form-label">Nomor HP / WhatsApp Aktif</label>
            <input type="text" id="nomor_hp" class="form-control" placeholder="08xxxxxxxxxx">
          </div>
          <div class="col-md-6">
            <label class="form-label">Gmail Aktif</label>
            <input type="email" id="gmail" class="form-control" placeholder="example@gmail.com">
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-end mt-4">
        <button class="btn-gradient" onclick="lanjutKeUpload()">Lanjut Upload Dokumen</button>
      </div>
    </div>

    <!-- ===== HALAMAN 2: UPLOAD DOKUMEN ===== -->
    <div id="halaman2" class="hidden">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="form-section-title mb-0">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="color:#06d6a0;">
            <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
          Dokumen yang Diperlukan
        </h4>
        <button class="btn-outline-light-custom" onclick="kembaliKeHalaman1()">← Kembali</button>
      </div>
      <div id="daftarDokumen" class="row g-3"></div>
      <div class="d-flex justify-content-end mt-4">
        <button class="btn-gradient" onclick="submitAkhir()">Kirim Pengajuan</button>
      </div>
    </div>

    <!-- ===== HALAMAN 3: SUKSES ===== -->
    <div id="halaman3" class="hidden text-center">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor" style="color:#06d6a0;">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
      <h3 class="mt-3">Pengajuan Berhasil Dikirim!</h3>
      <p class="text-muted">Notifikasi email telah dikirim ke Admin.</p>
      <button class="btn-gradient mt-3" onclick="resetForm()">Buat Pengajuan Baru</button>
    </div>

    <!-- ===== DAFTAR PENGAJUAN ===== -->
    <div id="listPengajuan" class="hidden">
      <h4 class="form-section-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="color:#00b4d8;">
          <path d="M4 6H20V8H4V6ZM4 11H20V13H4V11ZM4 16H14V18H4V16Z"/>
        </svg>
        Daftar Pengajuan
      </h4>
      <div id="listContainer"></div>
      <button class="btn-outline-light-custom mt-3" onclick="kembaliKeHalaman1()">← Kembali</button>
    </div>
  </div>
</div>

<script>
  async function callServer(action, params = {}) {
    const res = await fetch('/skbtHandler?action=' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    return await res.json();
  }

  const dokumenList = [
    { code: 'SKCPNS', nama: 'SK CPNS & PNS' },
    { code: 'SKPangkat', nama: 'SK Pangkat Terakhir' },
    { code: 'SKJabatan', nama: 'SK Jabatan Terakhir' },
    { code: 'SKP', nama: 'SKP 1 atau 2 Tahun Terakhir' },
    { code: 'SuratPermohonan', nama: 'Surat Permohonan' },
    { code: 'SuratPengantar', nama: 'Surat Pengantar dari Pimpinan OPD' },
    { code: 'SKBebasMasalah', nama: 'SK Bebas Masalah' },
    { code: 'SKBendahara', nama: 'SK Status Bebas Hutang/Piutang' }
  ];

  let currentSubmissionId = null;
  let namaPemohon = "";

  // ===== Pindah Halaman 1 ke 2 =====
  async function lanjutKeUpload() {
    const nama = document.getElementById('nama').value;
    const nip = document.getElementById('nip').value;
    const jabatan = document.getElementById('jabatan').value;
    const unit = document.getElementById('unit').value;
    const nomor_hp = document.getElementById('nomor_hp').value;
    const gmail = document.getElementById('gmail').value;

    if (!nama || !unit || !nomor_hp || !gmail) {
      alert('Nama, Unit Kerja, Nomor HP, dan Gmail wajib diisi!');
      return;
    }

    const res = await callServer('submitPengajuan', {
      nama_pemohon: nama, nip: nip, jabatan: jabatan, unit_kerja: unit, nomor_hp: nomor_hp, gmail: gmail
    });

    if (res.status === 'success') {
      currentSubmissionId = res.id;
      namaPemohon = nama;
      document.getElementById('halaman1').classList.add('hidden');
      document.getElementById('halaman2').classList.remove('hidden');
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      renderDokumen();
      alert('Pengajuan dibuat! Nomor: ' + res.nomor_pengajuan + '. Silakan upload dokumen.');
    } else {
      alert('Gagal: ' + res.msg);
    }
  }

  function renderDokumen() {
    const container = document.getElementById('daftarDokumen');
    container.innerHTML = dokumenList.map(doc => `
      <div class="col-md-6">
        <div class="doc-item">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="chk_${doc.code}" onchange="toggleUpload('${doc.code}')">
            <label class="form-check-label" for="chk_${doc.code}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color:#90e0ef; margin-right:8px;">
                <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
              </svg>
              ${doc.nama}
            </label>
          </div>
          <div id="upload_${doc.code}" class="hidden">
            <div class="upload-area" onclick="document.getElementById('file_${doc.code}').click()">
              <svg viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
              </svg>
              <p class="mb-0">Klik untuk Upload</p>
              <input type="file" id="file_${doc.code}" style="display:none;" onchange="uploadFile('${doc.code}')">
              <div class="progress-upload hidden" id="progress_${doc.code}">
                <div class="progress-bar-fill" id="bar_${doc.code}"></div>
              </div>
              <small id="status_${doc.code}" class="upload-status"></small>
            </div>
            <div id="filehistory_${doc.code}" class="file-history"></div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function toggleUpload(code) {
    const checked = document.getElementById('chk_' + code).checked;
    const uploadDiv = document.getElementById('upload_' + code);
    if (checked) {
      uploadDiv.classList.remove('hidden');
      renderFileHistory(code);
    } else {
      uploadDiv.classList.add('hidden');
    }
  }

  async function renderFileHistory(code) {
    if (!currentSubmissionId) return;
    const res = await callServer('getPengajuanById', { id: currentSubmissionId });
    if (res.status === 'success') {
      const docs = res.documents.filter(d => d.dokumen_code === code);
      const historyDiv = document.getElementById('filehistory_' + code);
      historyDiv.innerHTML = '';
      docs.forEach(doc => {
        historyDiv.innerHTML += `
          <div class="file-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="color:#06d6a0;">
              <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
            <a href="${doc.file_url}" target="_blank">${doc.file_name}</a>
          </div>`;
      });
    }
  }

  async function uploadFile(code) {
    const input = document.getElementById('file_' + code);
    if (!input.files.length) return;
    const file = input.files[0];
    const reader = new FileReader();
    const progressDiv = document.getElementById('progress_' + code);
    const bar = document.getElementById('bar_' + code);
    const status = document.getElementById('status_' + code);

    progressDiv.classList.remove('hidden');
    bar.style.width = '0%';
    status.innerText = 'Uploading...';
    status.classList.remove('success', 'error');

    reader.onprogress = function(e) {
      if (e.lengthComputable) {
        bar.style.width = Math.round((e.loaded / e.total) * 100) + '%';
      }
    };

    reader.onload = async (e) => {
      const base64 = e.target.result.split(',')[1];
      const res = await callServer('uploadDocument', {
        submission_id: currentSubmissionId,
        dokumen_code: code,
        nama_dokumen: dokumenList.find(d => d.code === code).nama,
        file_name: file.name,
        file_data: base64,
        nama_pemohon: namaPemohon // Kirim nama untuk folder di Drive
      });
      if (res.status === 'success') {
        bar.style.width = '100%';
        status.innerText = 'Terverifikasi';
        status.classList.add('success');
        setTimeout(() => progressDiv.classList.add('hidden'), 2000);
        renderFileHistory(code);
      } else {
        bar.style.width = '0%';
        status.innerText = 'Gagal: ' + res.msg;
        status.classList.add('error');
      }
    };
    reader.readAsDataURL(file);
  }

  function submitAkhir() {
    document.getElementById('halaman2').classList.add('hidden');
    document.getElementById('halaman3').classList.remove('hidden');
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step3').classList.add('active');
  }

  function resetForm() {
    document.getElementById('halaman1').classList.remove('hidden');
    document.getElementById('halaman2').classList.add('hidden');
    document.getElementById('halaman3').classList.add('hidden');
    document.getElementById('step3').classList.remove('active');
    document.getElementById('step1').classList.add('active');
    ['nama', 'nip', 'jabatan', 'unit', 'nomor_hp', 'gmail'].forEach(id => document.getElementById(id).value = '');
    currentSubmissionId = null;
    namaPemohon = "";
  }

  function kembaliKeHalaman1() {
    document.getElementById('halaman2').classList.add('hidden');
    document.getElementById('halaman1').classList.remove('hidden');
    document.getElementById('step1').classList.add('active');
    document.getElementById('step2').classList.remove('active');
  }

  async function tampilkanPengajuan() {
    document.getElementById('halaman1').classList.add('hidden');
    document.getElementById('listPengajuan').classList.remove('hidden');
    const res = await callServer('getAllPengajuan');
    document.getElementById('listContainer').innerHTML = res.map(s => `
      <div class="list-item">
        <div>
          <strong style="color:#fff;">${s.nomor_pengajuan}</strong> - ${s.nama_pemohon} (${s.unit_kerja})
          <br><small style="color:#adb5bd;">${s.status_verifikasi}</small>
        </div>
      </div>
    `).join('');
  }

  function kembaliKeFormAwal() {
    document.getElementById('listPengajuan').classList.add('hidden');
    document.getElementById('halaman1').classList.remove('hidden');
  }

  // Inisialisasi
  document.getElementById('daftarDokumen').innerHTML = '';
  // (Dokumen dirender saat pindah ke step 2)
</script>

</body>
</html>
